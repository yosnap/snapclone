<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Snapclone</title>
    <!--
      The "copied" bezel. It has no script: it fades in and out on its own and Rust destroys
      the window once the fade is over. The window is transparent, so only the square shows.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: default;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .bezel {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        height: 100%;
        padding: 18px 16px;
        border-radius: 22px;
        background: rgba(30, 30, 32, 0.78);
        color: rgba(255, 255, 255, 0.92);
        text-align: center;
        opacity: 0;
        animation: bezel 1.2s ease-in-out forwards;
      }

      .bezel svg {
        width: 84px;
        height: 84px;
      }

      .bezel p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.25;
      }

      @keyframes bezel {
        0% {
          opacity: 0;
          transform: scale(0.96);
        }
        12% {
          opacity: 1;
          transform: scale(1);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bezel {
          animation-timing-function: step-end;
        }
      }
    </style>
  </head>

  <body>
    <div class="bezel" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m5.5 12.5 4 4 9-9"
        />
      </svg>
      <p>Copiada al portapapeles</p>
    </div>
  </body>
</html>
