[package]
name = "snapclone"
version = "0.1.3"
description = "Capturas de pantalla embellecidas para macOS"
authors = ["yosnap"]
license = "MIT"
repository = "https://github.com/yosnap/snapclone"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["process", "sync", "time"] }
tauri-plugin-dialog = "2.8.3"
regex = "1.13.1"
tauri-plugin-store = "2.5.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
xcap = "0.9.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSBitmapImageRep", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSScreen", "NSSharingService", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFAttributedString", "CFCGTypes", "CFData", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGAffineTransform", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGDataProvider", "CGGradient", "CGImage", "CGPath"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["CTFont", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSURL"] }
objc2-vision = { version = "0.3", default-features = false, features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
# Evita que relanzar Snapclone mientras ya corre abra un segundo proceso (macOS resuelve esto
# con RunEvent::Reopen).
tauri-plugin-single-instance = "2"
# Entrada canónica única para toda la crate `windows` en Windows: cada fase posterior (OCR,
# compartir/arrastrar, portapapeles, fondo/sonido/explorer) AMPLÍA esta misma entrada con más
# features en vez de declarar una nueva. Hoy solo se necesita GetCursorPos (puntero global,
# movido aquí desde la Fase 10 para compartir el modelo de coordenadas).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    # OCR (Fase 3): Windows.Media.Ocr sobre una imagen decodificada en memoria.
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    # Compartir/arrastrar (Fase 4): panel de compartir nativo (DataTransferManager) y el
    # anti-auto-drop de Arrastrar (GetAsyncKeyState).
    "ApplicationModel_DataTransfer",
    "Storage",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    # Gaps menores (Fase 10): abrir carpeta/archivo sin subproceso (SHOpenFolderAndSelectItems,
    # SHParseDisplayName, CoInitializeEx/CoTaskMemFree), "Enviar comentarios" (ShellExecuteW),
    # fondo de escritorio (SystemParametersInfoW, ya cubierto por Win32_UI_WindowsAndMessaging)
    # y sonido de captura (PlaySoundW).
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_UI_Shell_Common",
] }
# Ya transitiva vía wry/tauri-runtime-wry a esta misma versión — declararla directamente solo
# da acceso a sus tipos (ICoreWebView2Settings3) para desactivar los aceleradores de teclado
# del navegador de WebView2 (F5/Ctrl+R recargarían la página y perderían la edición en curso).
# No añade ninguna copia nueva al árbol de dependencias.
webview2-com = "0.39.1"
# Escribir en el portapapeles (Copiar): API simple, retries internos ante contención, y la
# extensión `SetExtWindows` para excluir del Historial del portapapeles y de su sincronización
# en la nube. Leer (Pegar) usa la API Win32 directa de arriba, no esta crate — ver Fase 5.
arboard = "3.7.0"
# `IIterable<IStorageItem>` (Fase 4, panel de compartir) y `.join()` sobre `IAsyncOperation`
# (Fase 3 y 4) ya son dependencias DIRECTAS de la crate `windows` — aquí se declaran también
# como propias solo para poder escribir `use windows_collections::...`/`use windows_future::...`
# en este crate (Cargo no permite `use` de una dependencia transitiva). Mismas versiones que
# `windows` 0.62.2 ya trae, cero copias nuevas.
windows-collections = "0.3"
windows-future = "0.3"
# Arrastrar un archivo fuera del editor (drag-out). Trae por su cuenta `windows` 0.52 y
# `windows-core` 0.58 (coste de supply chain aceptado, ver plan.md — no es la misma copia que
# la entrada canónica de arriba).
drag = "2.1.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# `xcap` ya trae `image` 0.25 (solo con la feature `png`); esta entrada activa `jpeg` en esa
# MISMA copia para el resto de plataformas, sin duplicarla. Sin `tiff` a propósito (YAGNI +
# superficie de ataque, hallazgo del red team): `FILE_FORMATS` solo acepta PNG/JPEG en ninguna
# plataforma, así que un decodificador TIFF aquí no tendría ningún caso de uso real.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
