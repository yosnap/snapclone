<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Snapclone</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: crosshair;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 13px;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/selector.ts" defer></script>
  </head>

  <body>
    <canvas id="selector-canvas"></canvas>
    <p id="selector-hint" class="hint">Arrastra para elegir una zona · Espacio: ventana · Esc: cancelar</p>
  </body>
</html>
